<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Osmanoğlu Teknik - Teknisyen Paneli</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f7fb;
    color:#172033;
}

.topbar{
    min-height:72px;
    background:#fff;
    border-bottom:1px solid #e3e8f0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 28px;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
    color:#0a3766;
    font-weight:800;
}

.logo{
    width:42px;
    height:42px;
    border-radius:11px;
    background:#0b4f91;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
}

.user-area{
    display:flex;
    align-items:center;
    gap:15px;
}

.user-info{
    text-align:right;
}

.user-name{
    font-weight:700;
}

.user-code{
    margin-top:3px;
    color:#718096;
    font-size:13px;
}

.logout{
    border:1px solid #d7dee9;
    background:#fff;
    color:#374151;
    border-radius:9px;
    padding:10px 15px;
    cursor:pointer;
}

.logout:hover{
    background:#f5f7fa;
}

.container{
    max-width:1250px;
    margin:auto;
    padding:30px;
}

.welcome{
    margin-bottom:25px;
}

.welcome h1{
    font-size:29px;
    margin-bottom:7px;
}

.welcome p{
    color:#718096;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
    margin-bottom:30px;
}

.stat{
    background:#fff;
    border:1px solid #e3e8f0;
    border-radius:15px;
    padding:22px;
}

.stat-title{
    color:#718096;
    font-size:14px;
    margin-bottom:10px;
}

.stat-number{
    font-size:30px;
    font-weight:800;
}

.section-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:15px;
}

.section-head h2{
    font-size:21px;
}

.refresh{
    border:1px solid #d7dee9;
    background:#fff;
    border-radius:9px;
    padding:9px 14px;
    cursor:pointer;
}

.refresh:hover{
    background:#f5f7fa;
}

#message{
    margin-bottom:15px;
}

.error{
    background:#fff0f0;
    color:#a52828;
    border:1px solid #ffcaca;
    border-radius:10px;
    padding:15px;
}

.service-list{
    display:grid;
    gap:16px;
}

.service{
    background:#fff;
    border:1px solid #e3e8f0;
    border-radius:15px;
    padding:22px;
}

.service-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:15px;
    margin-bottom:18px;
}

.service-id{
    color:#718096;
    font-size:13px;
    margin-bottom:5px;
}

.customer{
    font-size:19px;
    font-weight:800;
}

.badge{
    padding:7px 12px;
    border-radius:20px;
    font-size:12px;
    font-weight:700;
    white-space:nowrap;
}

.pending{
    background:#fff4d6;
    color:#956700;
}

.progress{
    background:#dceeff;
    color:#075b9d;
}

.completed{
    background:#daf6e5;
    color:#08733b;
}

.other{
    background:#edf0f5;
    color:#596273;
}

.details{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;
}

.detail{
    background:#f7f9fc;
    border-radius:10px;
    padding:13px;
}

.label{
    font-size:11px;
    color:#7b8494;
    text-transform:uppercase;
    margin-bottom:5px;
}

.value{
    font-size:14px;
    font-weight:600;
    word-break:break-word;
}

.fault{
    margin-top:14px;
    padding:14px;
    background:#f4f8fc;
    border-left:4px solid #0b67ad;
    border-radius:7px;
}

.notes{
    margin-top:13px;
    color:#596273;
    font-size:14px;
    line-height:1.6;
}

.empty{
    background:#fff;
    border:1px dashed #ccd4e0;
    border-radius:15px;
    padding:45px;
    text-align:center;
    color:#718096;
}

@media(max-width:800px){

    .topbar{
        padding:12px 15px;
    }

    .user-info{
        display:none;
    }

    .container{
        padding:20px 15px;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
        gap:10px;
    }

    .details{
        grid-template-columns:1fr;
    }

}

</style>
</head>

<body>

<header class="topbar">

    <div class="brand">

        <div class="logo">
            OT
        </div>

        <span>
            Osmanoğlu Teknik
        </span>

    </div>


    <div class="user-area">

        <div class="user-info">

            <div
                class="user-name"
                id="userName"
            >
                Teknisyen
            </div>

            <div
                class="user-code"
                id="userCode"
            >
                OST-000
            </div>

        </div>


        <button
            class="logout"
            id="logout"
        >
            Çıkış Yap
        </button>

    </div>

</header>


<main class="container">

    <div class="welcome">

        <h1>
            Hoş geldin,
            <span id="welcomeName">
                Teknisyen
            </span>
        </h1>

        <p>
            Size atanmış servis taleplerini buradan takip edebilirsiniz.
        </p>

    </div>


    <div class="stats">

        <div class="stat">

            <div class="stat-title">
                Toplam Servis
            </div>

            <div
                class="stat-number"
                id="total"
            >
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-title">
                Bekleyen
            </div>

            <div
                class="stat-number"
                id="pending"
            >
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-title">
                Devam Eden
            </div>

            <div
                class="stat-number"
                id="progress"
            >
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-title">
                Tamamlanan
            </div>

            <div
                class="stat-number"
                id="completed"
            >
                0
            </div>

        </div>

    </div>


    <div id="message"></div>


    <div class="section-head">

        <h2>
            Size Atanan Servisler
        </h2>

        <button
            class="refresh"
            id="refresh"
        >
            Yenile
        </button>

    </div>


    <div
        class="service-list"
        id="services"
    >

        <div class="empty">
            Servisler yükleniyor...
        </div>

    </div>

</main>


<script>

const SUPABASE_URL =
    "https://akfiymgmhoqgebyroath.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_ZRGzrIshym7101FaQeLFXQ_cq0g3jom";


const servicesElement =
    document.getElementById("services");

const messageElement =
    document.getElementById("message");


/* SESSION */

function getSession(){

    try{

        const raw =
            localStorage.getItem(
                "supabase_session"
            );

        if(!raw){
            return null;
        }

        return JSON.parse(raw);

    }catch(error){

        return null;

    }

}


/* OTURUM KONTROL */

const session =
    getSession();


if(
    !session ||
    !session.access_token ||
    !session.user
){

    window.location.href =
        "index.html";

}else{

    const profile =
        session.profile || {};

    const name =
        profile.full_name ||
        "Teknisyen";

    const code =
        profile.technician_code ||
        "OST-000";


    document.getElementById("userName")
        .textContent = name;

    document.getElementById("welcomeName")
        .textContent = name;

    document.getElementById("userCode")
        .textContent = code;


    loadServices();

}


/* SERVİSLER */

async function loadServices(){

    messageElement.innerHTML = "";

    servicesElement.innerHTML =
        `
        <div class="empty">
            Servisler yükleniyor...
        </div>
        `;


    try{

        const url =
            SUPABASE_URL +
            "/rest/v1/service_requests" +
            "?assigned_to=eq." +
            encodeURIComponent(session.user.id) +
            "&select=id,customer_name,customer_phone,district,neighborhood,address,service_type,device,brand,model,fault,appointment_date,appointment_time,priority,status,notes,created_at" +
            "&order=appointment_date.asc.nullslast,appointment_time.asc.nullslast,created_at.desc";


        const response =
            await fetch(
                url,
                {
                    method:"GET",

                    headers:{
                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            session.access_token,

                        "Accept":
                            "application/json"
                    }
                }
            );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.message ||
                JSON.stringify(data)
            );

        }


        renderServices(
            Array.isArray(data)
            ? data
            : []
        );


    }catch(error){

        console.error(error);

        servicesElement.innerHTML = "";

        messageElement.innerHTML =
            `
            <div class="error">
                Servisler alınamadı:
                ${escapeHtml(error.message)}
            </div>
            `;

    }

}


/* RENDER */

function renderServices(list){

    let pendingCount = 0;
    let progressCount = 0;
    let completedCount = 0;


    list.forEach(item => {

        const status =
            normalizeStatus(item.status);

        if(status === "pending"){
            pendingCount++;
        }

        if(status === "progress"){
            progressCount++;
        }

        if(status === "completed"){
            completedCount++;
        }

    });


    document.getElementById("total")
        .textContent = list.length;

    document.getElementById("pending")
        .textContent = pendingCount;

    document.getElementById("progress")
        .textContent = progressCount;

    document.getElementById("completed")
        .textContent = completedCount;


    if(!list.length){

        servicesElement.innerHTML =
            `
            <div class="empty">

                <strong>
                    Henüz atanmış servis bulunmuyor.
                </strong>

                <br><br>

                Yeni bir servis atandığında
                burada görünecektir.

            </div>
            `;

        return;

    }


    servicesElement.innerHTML =
        list
        .map(createService)
        .join("");

}


/* SERVİS KARTI */

function createService(item){

    const status =
        normalizeStatus(item.status);


    const statusText =
        getStatusText(status);


    const device =
        [
            item.brand,
            item.model
        ]
        .filter(Boolean)
        .join(" ");


    const location =
        [
            item.district,
            item.neighborhood
        ]
        .filter(Boolean)
        .join(" / ");


    return `

        <article class="service">

            <div class="service-head">

                <div>

                    <div class="service-id">
                        Servis #${escapeHtml(item.id)}
                    </div>

                    <div class="customer">
                        ${escapeHtml(
                            item.customer_name ||
                            "Müşteri"
                        )}
                    </div>

                </div>


                <span class="badge ${status}">
                    ${escapeHtml(statusText)}
                </span>

            </div>


            <div class="details">

                <div class="detail">

                    <div class="label">
                        Telefon
                    </div>

                    <div class="value">
                        ${escapeHtml(
                            item.customer_phone || "-"
                        )}
                    </div>

                </div>


                <div class="detail">

                    <div class="label">
                        Servis Türü
                    </div>

                    <div class="value">
                        ${escapeHtml(
                            item.service_type || "-"
                        )}
                    </div>

                </div>


                <div class="detail">

                    <div class="label">
                        Cihaz
                    </div>

                    <div class="value">
                        ${escapeHtml(
                            device ||
                            item.device ||
                            "-"
                        )}
                    </div>

                </div>


                <div class="detail">

                    <div class="label">
                        Randevu
                    </div>

                    <div class="value">

                        ${escapeHtml(
                            formatDate(
                                item.appointment_date
                            )
                        )}

                        ${
                            item.appointment_time
                            ? " • " +
                              escapeHtml(
                                  item.appointment_time
                              )
                            : ""
                        }

                    </div>

                </div>


                <div class="detail">

                    <div class="label">
                        Bölge
                    </div>

                    <div class="value">
                        ${escapeHtml(
                            location || "-"
                        )}
                    </div>

                </div>


                <div class="detail">

                    <div class="label">
                        Öncelik
                    </div>

                    <div class="value">
                        ${escapeHtml(
                            item.priority || "-"
                        )}
                    </div>

                </div>


                <div
                    class="detail"
                    style="grid-column:1/-1"
                >

                    <div class="label">
                        Adres
                    </div>

                    <div class="value">
                        ${escapeHtml(
                            item.address || "-"
                        )}
                    </div>

                </div>

            </div>


            ${
                item.fault
                ?
                `
                <div class="fault">

                    <div class="label">
                        Arıza
                    </div>

                    <div class="value">
                        ${escapeHtml(item.fault)}
                    </div>

                </div>
                `
                :
                ""
            }


            ${
                item.notes
                ?
                `
                <div class="notes">

                    <strong>Not:</strong>

                    ${escapeHtml(item.notes)}

                </div>
                `
                :
                ""
            }

        </article>

    `;

}


/* DURUM */

function normalizeStatus(status){

    if(!status){
        return "other";
    }


    const value =
        String(status)
        .toLowerCase()
        .trim();


    if(
        value.includes("bekle") ||
        value.includes("pending") ||
        value === "yeni" ||
        value === "new"
    ){
        return "pending";
    }


    if(
        value.includes("devam") ||
        value.includes("progress") ||
        value.includes("process") ||
        value.includes("atan")
    ){
        return "progress";
    }


    if(
        value.includes("tamam") ||
        value.includes("complete") ||
        value.includes("closed") ||
        value.includes("kapalı")
    ){
        return "completed";
    }


    return "other";

}


function getStatusText(status){

    if(status === "pending"){
        return "Bekliyor";
    }

    if(status === "progress"){
        return "Devam Ediyor";
    }

    if(status === "completed"){
        return "Tamamlandı";
    }

    return "Belirtilmemiş";

}


/* TARİH */

function formatDate(date){

    if(!date){
        return "-";
    }


    const parts =
        String(date).split("-");


    if(parts.length === 3){

        return (
            parts[2] +
            "." +
            parts[1] +
            "." +
            parts[0]
        );

    }


    return date;

}


/* HTML GÜVENLİĞİ */

function escapeHtml(value){

    if(value === null ||
       value === undefined){

        return "";

    }


    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* YENİLE */

document.getElementById("refresh")
    .addEventListener(
        "click",
        loadServices
    );


/* ÇIKIŞ */

document.getElementById("logout")
    .addEventListener(
        "click",
        function(){

            localStorage.removeItem(
                "supabase_session"
            );

            window.location.href =
                "index.html";

        }
    );

</script>

</body>
</html>
